name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: make test
      - run: python3 tools/gen_fleet.py 3 > /tmp/fleet.json && go run ./cmd/pgfleet verify -config /tmp/fleet.json -driver mock -log-level error
